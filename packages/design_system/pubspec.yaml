name: design_system
description: >-
  Sousline's design tokens, theme, and shared widgets. Depends only on
  Flutter and its own fonts, never on domain, Riverpod, or a feature.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
