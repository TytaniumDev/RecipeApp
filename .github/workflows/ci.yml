name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Checks that span the whole workspace rather than one package.
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 🧭 Every package with tests is in the CI matrix
        run: .github/scripts/check_ci_matrix.sh

      - name: 🔒 pubspec.lock is up to date
        run: flutter pub get --enforce-lockfile

      - name: 🏗️ Generated code is up to date
        run: |
          dart run build_runner build --workspace
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is stale. Run 'dart run build_runner build --workspace' and commit the result."
            git status --porcelain
            git diff --stat
            exit 1
          fi

  # One job per workspace member, from Very Good Ventures' reusable workflow:
  # format, analyze, tests, and a coverage gate (ENGINEERING.md §16).
  # Every member uses flutter_package, even pure Dart ones, because a pub
  # workspace resolves all members together and the app needs the Flutter SDK.
  # When you add a package to the root pubspec.yaml, add it here too.
  package:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/domain
            min_coverage: 90
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      working_directory: ${{ matrix.package }}
      flutter_version_file: .fvmrc
      min_coverage: ${{ matrix.min_coverage }}
      coverage_excludes: "**/*.g.dart **/*.freezed.dart"

  # The single required status check for branch protection. It passes only
  # when every job above passed, so new jobs never need new protection rules.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [workspace, package]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
